name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  test:
    name: Python security and application gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.11.13
          cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Audit locked dependencies
        run: uv audit

      - name: Reject non-registry dependency sources
        run: |
          if grep -En 'source = \{ (git|url|path|directory|editable) =' uv.lock \
            | grep -vF 'source = { editable = "." }'; then
            echo "Non-registry dependency source found in uv.lock" >&2
            exit 1
          fi

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type-check
        run: uv run --frozen mypy src

      - name: Test security boundaries and application behavior
        run: uv run --frozen pytest -q

      - name: Build package
        run: uv build

      - name: Smoke-test CLI
        run: uv run --frozen retrokit --help
